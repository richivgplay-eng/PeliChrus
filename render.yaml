services:
  - type: web
    name: pelichrus-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/server.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TMDB_ACCESS_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_DAILY_TOKEN_LIMIT
        value: "5000"
      - key: CORS_ORIGINS
        sync: false
